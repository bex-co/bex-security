minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - openai
  - "@openai/*"
  - "@bex-co/muse-code-acp@0.6.0"
  - "@agentclientprotocol/codex-acp@1.12.0"
trustLockfile: true

auditConfig:
  ignoreGhsas:
    # extractPluginZip rejects every symlink entry before extract-zip creates it.
    - GHSA-jmr9-qjv8-65gv

# Stryker rewrites tsconfig files through the compiler API removed in TypeScript 7.
packageExtensions:
  "@stryker-mutator/core@10.0.0":
    dependencies:
      typescript: "6.0.3"

allowBuilds:
  esbuild: false
